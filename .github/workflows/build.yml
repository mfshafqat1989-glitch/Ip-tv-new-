name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip SignalIPTV.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: cd SignalIPTV && gradle assembleDebug --no-daemon
      - run: cp SignalIPTV/app/build/outputs/apk/debug/app-debug.apk signal-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signal TV build ${{ github.run_number }}
          files: signal-tv.apk
          make_latest: true
